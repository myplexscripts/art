<script>
  // Set appearance before painting, including cold loads with a dark system preference.
  { let theme; try { theme = localStorage.getItem('scenes-theme'); } catch {}
    document.documentElement.dataset.theme = ['light', 'dark'].includes(theme) ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
</script>
<meta name="description" content="Living posters for your screen. Each scene is drawn live in your browser, fits any screen, and is made to be left running.">

<script>
  // cold: a scene's own address, so the scene covers the page at once. intro: the first visit of a session, when the
  // page prints itself in piece by piece; /?intro plays it every time, for looking at it.
  // The artwork always covers the viewport. Only gallery content and player controls use safe-area padding.
  if (navigator.standalone || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || /[?&]edge\b/.test(location.search)) {
    document.documentElement.classList.add('edge');
  }
  if (/[?&]scene=/.test(location.search)) document.documentElement.classList.add('cold');
  else if (/[?&]intro/.test(location.search)) document.documentElement.classList.add('intro');   // ?intro always plays it
  else try { if (!sessionStorage.getItem('wavz-seen')) { sessionStorage.setItem('wavz-seen', '1'); document.documentElement.classList.add('intro'); } } catch (e) {}
  // One small tile of print grain, repeated over the page. It is made here, before anything is painted, so the paper
  // never shows without it.
  { const d = Math.min(2, devicePixelRatio), n = 256, g = Object.assign(document.createElement('canvas'), { width: n, height: n }), gx = g.getContext('2d'), im = gx.createImageData(n, n), px = new Uint32Array(im.data.buffer);
    for (let i = 0; i < px.length; i++) { const v = (Math.random() + Math.random() + Math.random()) / 3 - 0.5; px[i] = ((Math.min(255, Math.abs(v) * 0.72 * 255) | 0) << 24) | (v > 0 ? 0xffffff : 0); }

</script>
<style>
  /* a scene's own address opens this same page with the scene already over it; the page stays out of sight until it is */
  html.cold main, html.cold body::after { visibility: hidden; }
  @view-transition { navigation: auto; }
  :root { --cream: #f2e5c3; --navy: #0e1c3a; --orange: #dd7f45; --rust: #8f4520; --face: "Barlow Condensed", system-ui, sans-serif; --display: "Barlow Condensed", system-ui, sans-serif; }
  /* room is kept for the scrollbar from the start, so the page does not step sideways when the posters give it height */
  html { background: var(--gallery-paper); scrollbar-gutter: stable; }
  /* The rows of posters run out to the edges of the page. They measure it by this box (100cqw), not by the window
     (100vw), which is wider than the page by the scrollbar and would make the page scroll sideways. */
  .page { container-type: inline-size; box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  body { margin: 0; position: relative; min-height: 100vh; color: var(--gallery-ink); font-family: var(--face); touch-action: pan-y; }
  /* print grain over the whole page; it scrolls with the paper */
  body::after { content: ""; position: absolute; inset: 0; background: var(--grain, none); background-size: var(--grain-size, 256px); pointer-events: none; }
  main { max-width: 1180px; margin: 0 auto; padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 44px) 56px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  /* Text follows the enlarged hierarchy; interface labels and captions have a 16px floor. */
  h1 { margin: 0; font-family: var(--display); font-size: clamp(76.8px, 15.6vw, 180px); line-height: .82; font-weight: 700; letter-spacing: -.01em; }
  header p { margin: 0 0 6px; max-width: 21em; font-size: clamp(20.4px, 2.4vw, 26.4px); line-height: 1.3; font-weight: 600; text-align: right; }
  .rule { height: 6px; background: var(--orange); margin: clamp(14px, 2vw, 22px) 0; }
  h2 { margin: 0 0 clamp(10px, 2vw, 18px); font-family: var(--display); font-size: clamp(18px, 2.16vw, 24px); letter-spacing: .14em; text-transform: uppercase; color: var(--gallery-accent); }
  /* each series is a row of posters to slide through; it runs out to the edges of the screen */
  .series { margin-top: clamp(18px, 3vw, 34px); display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: clamp(4px, 1vw, 10px); }
  .series h2 { margin: 0; }
  .series button { font: 700 21.6px/1 var(--face); color: var(--gallery-ink); background: none; border: 2px solid currentColor; border-radius: 999px; width: 42px; height: 38px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .series button:disabled { opacity: .25; cursor: default; }
  .series div { display: flex; gap: 8px; }
  .posters { --pad: max(clamp(16px, 4vw, 44px), (100cqw - 1180px) / 2); display: flex; gap: clamp(10px, 2vw, 24px); overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--pad); padding: 8px var(--pad) 14px; margin: 0 calc(50% - 50cqw); touch-action: pan-x pan-y; scrollbar-width: none; overscroll-behavior-x: contain; }
  .posters::-webkit-scrollbar { display: none; }
  .posters a { flex: 0 0 clamp(230px, 72vw, 390px); display: block; scroll-snap-align: start; text-decoration: none; color: inherit; }
  /* a long press on a poster is ours (it runs the poster): no link preview, no lifting the picture to drag it, no selecting */
  .posters a, .posters canvas { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  @media (hover: none) { .series div { display: none; } }
  .posters a:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
  .posters canvas { width: 100%; height: auto; aspect-ratio: 3 / 4; display: block; }
  .posters a.textless canvas { position: relative; z-index: 1; }
  /* Arriving: the wordmark's letters rise from behind their baseline one after another, the orange rule is drawn across,
     the line of copy follows, and then the rows deal their posters in from the left, one row after another down the
     whole page, whether or not they are on screen yet. */
  @keyframes rise { from { transform: translateY(112%); } }
  @keyframes draw { from { transform: scaleX(0); } }
  @keyframes settle { from { opacity: 0; transform: translateY(14px); } }
  @keyframes deal { from { opacity: 0; transform: translateY(54px); clip-path: inset(0 0 100% 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }
  h1 span { display: inline-block; }
  html.intro h1 { clip-path: inset(-12% -2% 0 -2%); }
  html.intro h1 span { animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 90ms + .1s); }
  html.intro .rule { transform-origin: left; animation: draw .9s cubic-bezier(.6, 0, .2, 1) .45s both; }
  html.intro header p { animation: settle .6s ease .75s both; }
  html.intro { --d: .95s; }
  .series, .posters a { opacity: 0; }
  .series.in { opacity: 1; animation: settle .5s ease calc(var(--d, 0s) + var(--r) * .24s) both; }
  .posters.in a { opacity: 1; animation: deal .75s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--d, 0s) + var(--r) * .24s + var(--i) * 80ms + .1s); }
  .series.seen, .posters.seen a { opacity: 1; animation: none; }
  @media (prefers-reduced-motion: reduce) { html.intro h1 span, html.intro .rule, html.intro header p, .series.in, .posters.in a { animation: none; } }
  @media (max-width: 560px) { header p { text-align: left; } }
</style>
</head>
<body>
<div class="page">
<main>
  <header>
    <h1 aria-label="Scenes"><span style="--i:0">S</span><span style="--i:1">c</span><span style="--i:2">e</span><span style="--i:3">n</span><span style="--i:4">e</span><span style="--i:5">s</span></h1>
    <script>
      // The wordmark is set as separate letters so they can rise one by one, and letters set apart lose their kerning (the A
      // and V sit too far from each other). Each is pulled back by what the font would have kerned it, so the word is
      // the same width as if it were set whole.
      (() => { const h = document.currentScript.previousElementSibling, c = document.createElement('canvas').getContext('2d'), k = [...h.children];
        const kern = () => { const cs = getComputedStyle(h); c.font = cs.fontWeight + ' 200px ' + cs.fontFamily; const w = (t) => c.measureText(t).width;
          for (let i = 1; i < k.length; i++) k[i].style.marginLeft = (w(k[i - 1].textContent + k[i].textContent) - w(k[i - 1].textContent) - w(k[i].textContent)) / 200 + 'em'; };
        kern(); import('./live/typography.js?v=20261011-ui').then(({ fontReady }) => fontReady.then(kern)); })();
    </script>
    <p>Calming scenes for your screen. Open one, go fullscreen, and unwind.<span class="gallery-actions"><button class="scenes-guide" type="button">Welcome &amp; iPhone setup</button><button class="scenes-theme" type="button" role="switch" aria-checked="false" aria-label="Dark gallery">Dark mode <em>off</em></button></span></p>
  </header>
  <div class="rule"></div>
  <div id="rows"></div>
</main>
</div>
<script type="module">
  // Every poster on this page is the real scene at card size. It is held still until the pointer rests on it, then it
  // runs; opening it carries the same clock into the full-screen scene, so the motion never jumps.
  import './live/nozoom.js?v=20261011-ui';
  import { draw, makeLayout, SERIES, seriesLine } from './live/poster.js?v=20261011-ui';
  import { fontReady } from './live/typography.js?v=20261011-ui';
  import { galleryIsDark } from './live/theme.js?v=20261011-ui';
  import { openScene } from './live/player.js?v=20261011-ui';
  const LOOP = 30, STILL = 7.5, rows = document.getElementById('rows'), cards = [];
  // Only one poster runs at a time, the one under the pointer, and none while the page is being scrolled: drawing a
  // scene while the page moves is what makes scrolling drag. When scrolling stops, the poster under the pointer starts.
  // On a touch screen there is no pointer to rest: the poster under a finger runs for as long as the finger is down,
  // through any scrolling it does. (Touch scrolling is not held up by drawing the way wheel scrolling is.)
  let live = null, mouse = null, scrolling = 0, finger = null;
  function play(card) {
    if (live === card) return;
    if (live) { cancelAnimationFrame(live.run); live.run = 0; }
    live = card; if (!card) return;
    let last = performance.now();
    const step = (now) => { card.t += Math.min(0.1, (now - last) / 1000); last = now; card.paint(); card.run = requestAnimationFrame(step); };
    card.run = requestAnimationFrame(step);
  }
  const moved = () => {
    if (finger) return;
    play(null); clearTimeout(scrolling);
    scrolling = setTimeout(() => { scrolling = 0; const el = mouse && document.elementFromPoint(mouse[0], mouse[1]); const card = el && cards.find((c) => c.a.contains(el)); if (card && !player) play(card); }, 180);
  };
  addEventListener('scroll', moved, { passive: true, capture: true });
  // one row per series: its name, a pair of arrows, and its posters to slide through
  for (const series of SERIES) {
   const head = Object.assign(document.createElement('div'), { className: 'series', innerHTML: '<h2></h2><div><button aria-label="Earlier posters">&larr;</button><button aria-label="More posters">&rarr;</button></div>' });
   const wrap = Object.assign(document.createElement('div'), { className: 'posters' }), [prev, next] = head.querySelectorAll('button');
   head.querySelector('h2').textContent = series.name; rows.append(head, wrap); wrap.head = head;
   for (const [name, scene] of Object.entries(series.scenes)) {
    const a = document.createElement('a'), canvas = document.createElement('canvas');
    a.href = '?scene=' + name; a.setAttribute('aria-label', `${scene.title}, ${series.name} ${scene.no}`);
    a.classList.toggle('textless', scene.textless === true);
    a.draggable = false; a.addEventListener('dragstart', (e) => e.preventDefault());
    const caption = Object.assign(document.createElement('span'), { className: 'poster-caption' });
    caption.append(Object.assign(document.createElement('strong'), { className: 'poster-title', textContent: scene.title }), Object.assign(document.createElement('span'), { className: 'poster-meta', textContent: seriesLine(scene) }));
    a.append(canvas, caption); a.style.setProperty('--i', Math.min(wrap.children.length, 6)); wrap.append(a);
    const card = { name, scene, canvas, ctx: canvas.getContext('2d'), t: STILL, run: 0 };
    cards.push(card);
    const paint = () => { if (card.L) { card.ctx.setTransform(card.k, 0, 0, card.k, 0, 0); draw(card.ctx, card.t / LOOP, card.L, card.t); } };
    card.paint = paint; card.a = a;
    a.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') { mouse = [e.clientX, e.clientY]; if (!scrolling) play(card); } });
    a.addEventListener('pointerleave', () => { if (live === card && finger !== card) play(null); });
    // A long press is a way to watch a poster run without opening it: the browser's own long-press menu is kept away,
    // and lifting the finger after one does not count as a tap.
    let downAt = 0, longUntil = 0;
    a.addEventListener('touchstart', () => { finger = card; downAt = performance.now(); if (!player) play(card); }, { passive: true });
    for (const type of ['touchend', 'touchcancel']) a.addEventListener(type, () => { if (finger === card) { finger = null; if (performance.now() - downAt > 450) longUntil = performance.now() + 500; if (live === card) play(null); } }, { passive: true });
    a.addEventListener('contextmenu', (e) => { if (finger === card || performance.now() < longUntil) e.preventDefault(); });
    a.addEventListener('click', (e) => { if (e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); if (performance.now() < longUntil) return; history.pushState({ scene: name }, '', a.href); open(name, true); });
   }
   // the arrows go quiet at either end. They move one poster at a time, eased over most of a second; snapping is held
   // off while the row is being moved
   const ends = () => { prev.disabled = wrap.scrollLeft < 4; next.disabled = wrap.scrollLeft > wrap.scrollWidth - wrap.clientWidth - 4; };
   let sliding = 0, hold = 0, held = 0;
   const GLIDE = 1.4;   // posters a second while an arrow is held down
   const stepOf = () => { const kids = wrap.children; return kids.length > 1 ? kids[1].offsetLeft - kids[0].offsetLeft : wrap.clientWidth; };
   // a tap moves one poster; letting go of a held arrow coasts on to the next poster at the speed the row already had
   const slide = (dir, settle = false) => {
    const stepW = stepOf(), max = wrap.scrollWidth - wrap.clientWidth, from = wrap.scrollLeft, n = from / stepW;
    const to = Math.max(0, Math.min(max, (settle ? (dir > 0 ? Math.ceil(n - 0.02) : Math.floor(n + 0.02)) : Math.round(n) + dir) * stepW)), t0 = performance.now();

   };

    b.addEventListener('contextmenu', (e) => { if (held) e.preventDefault(); });
   }

  }
  // Gallery captions follow the gallery theme; the artwork keeps its own palette.
  const size = (redraw = null, only = false) => { const dark = galleryIsDark(); for (const c of cards) {
    if (only && c.name !== redraw) continue;
    const r = c.canvas.getBoundingClientRect(), d = Math.min(2, devicePixelRatio), w = Math.round(r.width * d), h = Math.round(r.height * d);
    // a poster is only drawn again when its size or the frame it should wear has changed, or when it is asked for by name
    if (!w || (redraw !== c.name && w === c.canvas.width && h === c.canvas.height && c.dark === dark)) continue;
    c.canvas.width = w; c.canvas.height = h; c.dark = dark; c.L = makeLayout(w / h, c.scene, { brand: false, dark, frame: 0, cssWidth: r.width }); c.k = w / c.L.VW;
    c.ctx.setTransform(c.k, 0, 0, c.k, 0, 0); draw(c.ctx, c.t / LOOP, c.L, c.t);
  } };
  let pending; addEventListener('resize', () => { clearTimeout(pending); pending = setTimeout(() => size(), 120); }); size();
  fontReady.then(() => { for (const card of cards) card.paint(); });
  addEventListener('scenes-theme-change', () => size());

  // Tapping a poster opens the scene over this page, growing out of the poster to fill the screen, and the address
  // becomes the scene's own. Going back shrinks it into the poster again. A scene's address opened directly, or
  // reloaded, is this same page with the scene already open over it, so leaving it shrinks into its poster all the same.
  let player = null, departing = null;
  history.scrollRestoration = 'manual';   // going back must not move the page under the poster as it shrinks home
  const rectOf = (name) => { const r = cards.find((c) => c.name === name).canvas.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; };
  const resolveSceneName = name => ({ endlesslayers: 'stacks', petalorbit: 'blooms', sand: 'deepwaves' }[name] ?? name);
  function open(name, grow) {
    name = resolveSceneName(name);
    if (!cards.some(c => c.name === name)) { leave(); return; }
    departing?.close({ immediate: true }); departing = null;
    player?.close({ immediate: true });
    const card = cards.find((c) => c.name === name); play(null);
    // back goes back when this page is what lies behind; a scene opened cold has nothing of ours behind it, so its
    // address is swapped for the page's and the scene is closed here
    player = openScene(name, { from: grow ? rectOf(name) : null, thumbnailFrame: 0, home: () => { if (history.state?.scene && !history.state.cold) history.back(); else { history.replaceState(null, '', location.pathname); leave(); } }, at: grow ? card.t : null });
    window.gtag?.('event', 'page_view', { page_location: location.href });
  }
  addEventListener('popstate', (e) => { if (e.state?.scene) open(e.state.scene, false); else leave(); });
  function leave() {
    if (!player) return;
    const was = player; departing = was; player = null;
    // the scene may have been changed inside the player: bring its poster into view before shrinking back into it
    const card = cards.find((c) => c.name === was.name); card.t = was.time;
    const r = card.canvas.getBoundingClientRect();
    if (r.bottom < 60 || r.top > innerHeight - 60 || r.right < 60 || r.left > innerWidth - 60) card.canvas.parentNode.scrollIntoView({ behavior: 'instant', block: 'center', inline: 'center' });
    // the poster is found again on every frame of the way back, so it is met where it really is even if the page shifts
    // only the poster being returned to is drawn now; the rest catch up with a changed frame once the scene has landed
    size(was.name, true); was.close({ to: () => rectOf(was.name) }); setTimeout(() => size(), 1000);
  }
  // every row deals itself in on arrival, one after another down the page; under a scene opened cold, they are simply there
  const cold = document.documentElement.classList.contains('cold');
  rows.querySelectorAll('.posters').forEach((wrap, r) => { for (const el of [wrap, wrap.head]) { el.style.setProperty('--r', r); el.classList.add(cold ? 'seen' : 'in'); } });
  setTimeout(() => document.documentElement.classList.remove('intro'), 6000);   // long after the opening has played out
  const asked = resolveSceneName(new URLSearchParams(location.search).get('scene'));
  if (asked && cards.some((c) => c.name === asked)) {
    if (history.state?.scene !== asked) history.replaceState({ ...history.state, scene: asked, cold: history.state?.cold ?? true }, '');
    cards.find((c) => c.name === asked).canvas.parentNode.scrollIntoView({ behavior: 'instant', block: 'center', inline: 'center' });
    open(asked, false);
  }
  document.documentElement.classList.remove('cold');
</script>
