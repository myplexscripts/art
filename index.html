<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Morrow is a place to publish, organize, discover, and collect visual work." />
  <meta name="theme-color" content="#11110f" />
  <title>Morrow — Art, portfolios, and process</title>
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="wordmark" href="#" data-route="explore" aria-label="Morrow home">morrow</a>

    <nav class="primary-nav" aria-label="Primary">
      <button class="nav-link is-active" data-view="explore">Explore</button>
      <button class="nav-link" data-view="following">Following</button>
      <button class="nav-link" data-view="collections">Collections</button>
      <button class="nav-link" data-view="jobs">Jobs</button>
    </nav>

    <div class="topbar-actions">
      <label class="search" for="global-search">
        <span aria-hidden="true">⌕</span>
        <input id="global-search" type="search" placeholder="Search work, artists, tags" autocomplete="off" />
        <kbd>/</kbd>
      </label>
      <button class="button button-primary" id="upload-button">Upload</button>
      <button class="avatar-button" id="profile-button" aria-label="Open your profile">
        <span class="avatar avatar-me">DV</span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <aside class="upload-drawer" id="upload-drawer" aria-hidden="true" aria-labelledby="upload-title">
    <div class="drawer-head">
      <div>
        <p class="eyebrow">New project</p>
        <h2 id="upload-title">Publish your work</h2>
      </div>
      <button class="icon-button" id="close-upload" aria-label="Close upload">×</button>
    </div>

    <form id="upload-form">
      <label class="drop-zone" id="drop-zone">
        <input id="art-file" type="file" accept="image/*" />
        <img id="upload-preview" alt="" hidden />
        <span class="drop-copy">
          <strong>Drop an image here</strong>
          <small>or choose a file · JPG, PNG, GIF, WEBP</small>
        </span>
      </label>

      <div class="form-grid">
        <label>
          <span>Title</span>
          <input id="art-title" required maxlength="80" placeholder="Untitled work" />
        </label>
        <label>
          <span>Creative field</span>
          <select id="art-field">
            <option>Illustration</option>
            <option>Digital Art</option>
            <option>Photography</option>
            <option>3D</option>
            <option>Graphic Design</option>
            <option>Painting</option>
            <option>Motion</option>
          </select>
        </label>
      </div>

      <label>
        <span>Description</span>
        <textarea id="art-description" rows="4" maxlength="900" placeholder="Process, materials, context, credits..."></textarea>
      </label>

      <label>
        <span>Tags</span>
        <input id="art-tags" placeholder="portrait, editorial, gouache" />
        <small>Comma separated</small>
      </label>

      <div class="toggle-row">
        <div>
          <strong>Add to portfolio</strong>
          <small>Show this project in your curated portfolio.</small>
        </div>
        <label class="switch">
          <input id="portfolio-toggle" type="checkbox" checked />
          <span></span>
        </label>
      </div>

      <div class="toggle-row">
        <div>
          <strong>Show process details</strong>
          <small>Add tools and making notes to the project page.</small>
        </div>
        <label class="switch">
          <input id="process-toggle" type="checkbox" />
          <span></span>
        </label>
      </div>

      <div class="drawer-footer">
        <button type="button" class="button button-quiet" id="save-draft">Save draft</button>
        <button type="submit" class="button button-primary">Publish project</button>
      </div>
    </form>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <dialog class="art-dialog" id="art-dialog">
    <button class="dialog-close" id="dialog-close" aria-label="Close project">×</button>
    <div id="art-dialog-content"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="app.js"></script>
</body>
</html>
